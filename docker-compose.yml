# Векторная БД Qdrant. Запуск: docker compose up -d
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant-solar
    ports:
      - "6333:6333"   # REST + веб-панель http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: unless-stopped
