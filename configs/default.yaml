# Базовая конфигурация RAG-системы «Солнечная система» (русская Википедия).
# Любой параметр можно переопределить из CLI: --set retrieval.top_k=10

paths:
  data: data
  raw: data/raw              # сырые ответы источника (HTML в JSON)
  documents: data/documents  # распарсенные документы (единый формат)
  manifest: data/manifest.db # состояние grabber'а (SQLite)
  cache: data/cache          # кэш эмбеддингов и ответов LLM
  qdrant: data/qdrant        # локальное хранилище Qdrant (embedded mode)

grabber:
  user_agent: "RagLabStudent/0.2 (university RAG lab; contact: ferlik1988@gmail.com)"
  request_delay_sec: 0.3     # вежливая пауза между запросами
  timeout_sec: 30
  max_retries: 5

  wikipedia:
    api_url: https://ru.wikipedia.org/w/api.php
    page_url: https://ru.wikipedia.org/wiki/
    # секции, которые не несут знаний для RAG (удаляем как шум)
    skip_sections: [Примечания, Литература, Ссылки, См. также, Комментарии, Источники,
                    Галерея, Сноски, В культуре, В массовой культуре, В искусстве, Внешние ссылки]
    # статьи по группам: группа → entity_type в metadata
    articles:
      star: [Солнце, Солнечная система, Солнечный ветер, Гелиосфера]
      planet: [Меркурий, Венера, Земля, Марс, Юпитер, Сатурн, Уран (планета), Нептун,
               Планета земной группы, Планета-гигант, Кольца Сатурна, Большое красное пятно]
      dwarf_planet: [Карликовая планета, Плутон, Церера (карликовая планета), Эрида (карликовая планета),
                     Макемаке (карликовая планета), Хаумеа (карликовая планета), Седна (малая планета)]
      moon: [Луна, Фобос, Деймос, Ио (спутник), Европа (спутник), Ганимед (спутник), Каллисто (спутник),
             Титан (спутник), Энцелад, Мимас (спутник), Япет (спутник), Рея (спутник), Тефия (спутник),
             Диона (спутник), Миранда (спутник), Титания (спутник), Оберон (спутник), Ариэль (спутник),
             Тритон (спутник), Харон (спутник), Спутники Юпитера, Спутники Сатурна, Спутники Марса,
             Естественный спутник]
      small_body: [Пояс астероидов, Пояс Койпера, Облако Оорта, Рассеянный диск, Астероид, Комета,
                   Комета Галлея, Комета Шумейкеров — Леви 9, Комета Хейла — Боппа, Чурюмова — Герасименко,
                   Веста (астероид), Паллада (астероид), Апофис (астероид), Метеор, Метеорит,
                   Транснептуновый объект, Кентавры (астрономия), Троянские астероиды Юпитера,
                   Тунгусский метеорит, Челябинский метеорит]
      mission: [Вояджер-1, Вояджер-2, Пионер-10, Пионер-11, Новые горизонты, Кассини — Гюйгенс,
                Галилео (космический аппарат), Юнона (космический аппарат), Розетта (космический аппарат),
                Марсианская научная лаборатория, Персеверанс (марсоход), Спирит (марсоход),
                Оппортьюнити, Ингенуити, Луна-2, Луна-9, Луноход-1, Аполлон-11, Программа «Аполлон»,
                Венера-7, Венера-13, Маринер-10, MESSENGER, BepiColombo, Магеллан (космический аппарат),
                Хаябуса-2, OSIRIS-REx, DART (космический аппарат), Dawn (космический аппарат), Викинг-1, Марс-3, Чанъэ-4, Чандраян-3,
                Джеймс Уэбб (телескоп), Хаббл (телескоп), Паркер (зонд), Европа Клиппер, JUICE, Луна-25]
      science: [Законы Кеплера, Астрономическая единица, Гравитация, Небулярная гипотеза,
                Планета Девять, Экзопланета, Затмение, Солнечное затмение, Приливы и отливы,
                Обитаемая зона, Международный астрономический союз]

# ---------------------------------------------------------------- pipeline
chunking:
  strategy: section        # fixed | paragraph | section
  size: 128                # токенов (токенизатор XLM-R); выбран в S1
  overlap: 0               # токенов, только для fixed
  prefix_title: true       # "Документ — Секция" в начале chunk

embedding:
  model: bge-m3            # e5-small | bge-m3 (см. src/embeddings); выбрана в S2

vector_store:
  url: null                # null → embedded-режим (data/qdrant); http://localhost:6333 → Qdrant в Docker

retrieval:
  mode: dense              # dense | bm25 | hybrid
  top_k: 10                # сколько кандидатов достаём из индекса; выбрано в S3
  filters: {}              # фильтр по metadata, напр. {entity_type: [planet, moon]}

filtering:
  score_threshold: 0.0     # минимальный cosine score (0 — выключено)
  min_chars: 60
  dedup: true
  max_per_doc: 0

reranker:
  enabled: true
  model: bge-m3            # bge-m3 (BAAI/bge-reranker-v2-m3) | mminilm
  top_n: 5                 # сколько chunks уходит в LLM
  min_score: 0.3           # порог релевантности после rerank (0 — выключено); выбран в S5

generation:
  provider: groq
  model: openai/gpt-oss-20b    # выбрана в эксперименте LLM × промпт
  prompt: strict           # strict | basic
  temperature: 0.0
  max_tokens: 1500

judge:
  provider: gemini
  model: gemini-3.5-flash-lite
  temperature: 0.0
  max_tokens: 2000

# особые параметры моделей (передаются в теле запроса)
llm_models:
  openai/gpt-oss-120b: {extra: {reasoning_effort: low}}
  openai/gpt-oss-20b: {extra: {reasoning_effort: low}}
